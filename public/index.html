<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161518" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>Vault</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('vr-settings') || '{}');
      if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme;
      if (s.textScale) document.documentElement.style.setProperty('--text-scale', s.textScale);
    } catch {}
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <a class="brand" id="brand" href="#/">
      <img src="icons/icon-192.png" alt="" width="26" height="26">
      <span id="brand-name">Vault</span>
    </a>
    <div class="topbar-title" id="topbar-title"></div>
    <a class="sync-pill" id="sync-pill" href="#/settings" aria-label="Sync status">
      <span class="dot"></span><span class="label">…</span>
    </a>
    <a class="icon-btn" href="#/search" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </a>
  </header>
  <main id="view" class="view"></main>
  <button class="toc-fab" id="toc-fab" aria-label="Contents" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
  </button>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <nav class="sheet" id="toc-sheet" aria-label="Contents" hidden></nav>
</body>
</html>
